name: Moe AI Station CI

on:
  push:
    branches:
      - dev/mo-ai-station
  pull_request:
    branches:
      - feat/harness-backend
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-managed-task-host:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/mo-ai-station'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout derivative branch
        uses: actions/checkout@v6
        with:
          ref: dev/mo-ai-station

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply fail-closed host patch
        run: node scripts/apply-managed-task-host.js

      - name: Syntax check host
        run: node --check sidecar/index.js

      - name: Verify managed task host before commit
        run: |
          node test/managed-task-history.test.js
          node test/managed-task-history-adapter.test.js
          node test/managed-task-history-disk.test.js
          node test/managed-task-history-http.test.js
          node test/managed-task-history-host.test.js
          node test/managed-task-history-host-wiring.test.js
          node test/managed-orchestration-wiring.test.js
          node test/orchestration-bridge-contract.test.js
          git diff --check

      - name: Commit verified host wiring if needed
        run: |
          if git diff --quiet -- sidecar/index.js; then
            echo "Host wiring already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/index.js
          git commit -m "feat: wire durable managed task history into host"
          git push origin HEAD:dev/mo-ai-station

  orchestration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Derivative verification contract
        run: |
          node test/moe-feature-evidence.test.js

      - name: Derivative orchestration contracts
        run: |
          node test/orchestration-role-policy.test.js
          node test/org-role.test.js
          node test/delegation-adapter.test.js
          node test/result-envelope.test.js
          node test/review-gate.test.js
          node test/managed-delegation.test.js
          node test/orchestration-auditor.test.js
          node test/orchestration-quality-pipeline.test.js
          node test/managed-orchestration-tool.test.js
          node test/managed-orchestration-wiring.test.js
          node test/orchestration-bridge-contract.test.js
          node test/managed-task-history.test.js
          node test/managed-task-history-adapter.test.js
          node test/managed-task-history-disk.test.js
          node test/managed-task-history-http.test.js
          node test/managed-task-history-host.test.js
          node test/org-specialties.test.js

      - name: Inherited orchestration regression
        run: |
          node test/orchestration.test.js
          node test/subagents.test.js

      - name: Security boundary regression
        run: |
          node test/permissions.test.js
          node test/permgrants.test.js
          node test/capgate.test.js
          node test/consent.interactive.test.js
          node test/halt.test.js
