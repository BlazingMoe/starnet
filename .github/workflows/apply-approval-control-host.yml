name: Apply approval control host

on:
  push:
    branches:
      - dev/mo-ai-station
    paths:
      - scripts/apply-approval-control-host.js
      - .github/workflows/apply-approval-control-host.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: dev/mo-ai-station

      - name: Apply fail-closed host patch
        run: node scripts/apply-approval-control-host.js

      - name: Verify focused contracts
        run: |
          node test/control-approval-view.test.js
          node test/control-approval-http.test.js
          node test/control-approval-host-wiring.test.js

      - name: Commit host wiring
        run: |
          if git diff --quiet -- sidecar/index.js; then
            echo "Approval control host wiring already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/index.js
          git commit -m "feat: wire read-only approval control endpoint"
          git push origin HEAD:dev/mo-ai-station
