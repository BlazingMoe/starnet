name: Apply provider control host

on:
  push:
    branches:
      - dev/mo-ai-station
    paths:
      - scripts/apply-provider-control-host.js
      - test/control-provider-host-wiring.test.js
      - test/control-provider-view.test.js
      - test/control-provider-http.test.js
      - .github/workflows/apply-provider-control-host.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: dev/mo-ai-station

      - name: Verify fail-closed patch contract
        run: node test/control-provider-host-wiring.test.js

      - name: Apply fail-closed host patch
        run: node scripts/apply-provider-control-host.js

      - name: Verify provider view contract
        run: node test/control-provider-view.test.js

      - name: Verify provider HTTP contract
        run: node test/control-provider-http.test.js

      - name: Commit host wiring
        run: |
          if git diff --quiet -- sidecar/index.js; then
            echo "Provider control host wiring already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/index.js
          git commit -m "feat: wire read-only provider control endpoint"
          git push origin HEAD:dev/mo-ai-station
